<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trackiva - Smart School Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
        },
        colors: {
          primary: '#3b82f6', // Royal Blue
          secondary: '#64748b',
          accent: '#8b5cf6', // Violet
          danger: '#f43f5e',
          success: '#22c55e',
          warning: '#f59e0b',
          'ai-purple': '#a855f7', // AI Purple
          glass: {
            100: 'rgba(255, 255, 255, 0.1)',
            200: 'rgba(255, 255, 255, 0.2)',
            300: 'rgba(255, 255, 255, 0.3)',
            400: 'rgba(255, 255, 255, 0.4)',
            500: 'rgba(255, 255, 255, 0.5)',
            600: 'rgba(255, 255, 255, 0.6)',
            700: 'rgba(255, 255, 255, 0.7)',
            800: 'rgba(255, 255, 255, 0.8)',
            900: 'rgba(255, 255, 255, 0.9)',
          }
        },
        keyframes: {
          "fade-in": {
            "0%": { opacity: "0", transform: "translateY(10px)" },
            "100%": { opacity: "1", transform: "translateY(0)" }
          },
          "zoom-in-95": {
            "0%": { opacity: "0", transform: "scale(0.95)" },
            "100%": { opacity: "1", transform: "scale(1)" }
          },
          "float": {
            "0%, 100%": { transform: "translateY(0)" },
            "50%": { transform: "translateY(-5px)" }
          },
          "breathing-glow": {
            "0%, 100%": { 
              boxShadow: "0 0 15px rgba(59, 130, 246, 0.3), inset 0 0 5px rgba(59, 130, 246, 0.2)",
              transform: "scale(1)" 
            },
            "50%": { 
              boxShadow: "0 0 25px rgba(59, 130, 246, 0.5), inset 0 0 10px rgba(59, 130, 246, 0.3)",
              transform: "scale(1.02)"
            }
          }
        },
        animation: {
          "fade-in": "fade-in 400ms cubic-bezier(0.16, 1, 0.3, 1)",
          "zoom-in-95": "zoom-in-95 400ms cubic-bezier(0.16, 1, 0.3, 1)",
          "float": "float 3s ease-in-out infinite",
          "breathing-glow": "breathing-glow 4s ease-in-out infinite"
        },
        boxShadow: {
          'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.1)',
          'glass-hover': '0 12px 40px 0 rgba(31, 38, 135, 0.2)',
          'inner-light': 'inset 0 0 20px rgba(255, 255, 255, 0.5)',
        },
        transitionTimingFunction: {
          'spring': 'cubic-bezier(0.34, 1.56, 0.64, 1)',
        }
      }
    }
  }
</script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

      body {
        font-family: 'Inter', sans-serif;
      }

      /* Light mode mesh gradient */
      body:not(.dark) {
        background-color: #eef2ff;
        background-image: 
          radial-gradient(at 40% 20%, hsla(215,98%,61%,0.15) 0px, transparent 50%),
          radial-gradient(at 80% 0%, hsla(189,100%,56%,0.15) 0px, transparent 50%),
          radial-gradient(at 0% 50%, hsla(340,100%,76%,0.15) 0px, transparent 50%),
          radial-gradient(at 80% 50%, hsla(270,100%,76%,0.15) 0px, transparent 50%),
          radial-gradient(at 0% 100%, hsla(22,100%,77%,0.15) 0px, transparent 50%),
          radial-gradient(at 80% 100%, hsla(242,100%,70%,0.15) 0px, transparent 50%),
          radial-gradient(at 0% 0%, hsla(343,100%,76%,0.15) 0px, transparent 50%);
      }
      
      /* Dark mode mesh gradient */
      body.dark {
        background-color: #020617; /* slate-950 */
        background-image: 
          radial-gradient(at 20% 20%, hsla(215, 80%, 30%, 0.3) 0px, transparent 50%),
          radial-gradient(at 80% 10%, hsla(260, 70%, 40%, 0.3) 0px, transparent 50%),
          radial-gradient(at 10% 90%, hsla(320, 60%, 40%, 0.3) 0px, transparent 50%),
          radial-gradient(at 80% 90%, hsla(190, 70%, 40%, 0.3) 0px, transparent 50%);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(156, 163, 175, 0.5);
        border-radius: 20px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(100, 116, 139, 0.8);
      }
      
      @media print {
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        body { background: white; overflow: visible; }
      }
    </style>

</script>
