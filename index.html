<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Trackiva - Smart School Management</title>

  <!-- Preload Fonts for Faster Rendering -->
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />
  <link
    rel="preload"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    as="style"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Global Base Styles -->
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>

  <!-- Optimized Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          },
          colors: {
            primary: '#3b82f6',
            secondary: '#64748b',
            accent: '#8b5cf6',
            danger: '#f43f5e',
            success: '#22c55e',
            warning: '#f59e0b',
            'ai-purple': '#a855f7',
            glass: {
              100: 'rgba(255,255,255,0.1)',
              200: 'rgba(255,255,255,0.2)',
              300: 'rgba(255,255,255,0.3)',
              400: 'rgba(255,255,255,0.4)',
              500: 'rgba(255,255,255,0.5)',
              600: 'rgba(255,255,255,0.6)',
              700: 'rgba(255,255,255,0.7)',
              800: 'rgba(255,255,255,0.8)',
              900: 'rgba(255,255,255,0.9)'
            }
          },
          keyframes: {
            'fade-in': {
              '0%': { opacity: '0', transform: 'translateY(6px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            'zoom-in': {
              '0%': { opacity: '0', transform: 'scale(0.97)' },
              '100%': { opacity: '1', transform: 'scale(1)' }
            },
            float: {
              '0%,100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-4px)' }
            }
          },
          animation: {
            'fade-in': 'fade-in 300ms cubic-bezier(0.16,1,0.3,1)',
            'zoom-in': 'zoom-in 320ms cubic-bezier(0.16,1,0.3,1)',
            float: 'float 3s ease-in-out infinite'
          },
          boxShadow: {
            glass: '0 8px 32px rgba(31,38,135,0.1)',
            'glass-hover': '0 12px 40px rgba(31,38,135,0.2)',
            'inner-light': 'inset 0 0 20px rgba(255,255,255,0.4)'
          }
        }
      }
    }
  </script>

  <!-- Gradient Background + UI Polish -->
  <style>
    /* LIGHT MODE */
    body:not(.dark) {
      background-color: #eef2ff;
      background-image:
        radial-gradient(at 40% 20%, rgba(59,130,246,0.15) 0, transparent 50%),
        radial-gradient(at 80% 0%, rgba(34,211,238,0.15) 0, transparent 50%),
        radial-gradient(at 0% 50%, rgba(236,72,153,0.15) 0, transparent 50%),
        radial-gradient(at 80% 50%, rgba(139,92,246,0.15) 0, transparent 50%),
        radial-gradient(at 0% 100%, rgba(251,146,60,0.15) 0, transparent 50%),
        radial-gradient(at 80% 100%, rgba(109,40,217,0.15) 0, transparent 50%);
    }

    /* DARK MODE */
    body.dark {
      background-color: #020617;
      background-image:
        radial-gradient(at 20% 20%, rgba(59,130,246,0.3) 0, transparent 50%),
        radial-gradient(at 80% 10%, rgba(139,92,246,0.3) 0, transparent 50%),
        radial-gradient(at 10% 90%, rgba(244,63,94,0.3) 0, transparent 50%),
        radial-gradient(at 80% 90%, rgba(34,211,238,0.3) 0, transparent 50%);
    }

    /* Modern Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb {
      background: rgba(156,163,175,0.5);
      border-radius: 20px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100,116,139,0.8);
    }

    @media print {
      .no-print { display: none !important; }
      body { background: white; }
    }
  </style>

  <!-- Import Map -->
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?external=react",
    "react-dom": "https://esm.sh/react-dom@18.2.0?external=react",
    "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react",
    "@google/genai": "https://esm.sh/@google/genai@0.2.0",
    "xlsx": "https://esm.sh/xlsx@0.18.5",
    "qrcode": "https://esm.sh/qrcode@1.5.3",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3",
    "path": "https://aistudiocdn.com/path@^0.12.7",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "vite": "https://aistudiocdn.com/vite@^7.2.6",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1"
  }
}
</script>

  <link rel="stylesheet" href="/index.css" />
</head>

<body class="min-h-screen text-base selection:bg-primary/30 selection:text-primary-900">
  <div id="root"></div>

  <script type="module" src="./index.tsx"></script>
</body>
</html>
